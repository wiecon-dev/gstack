schema: spec-driven

context: |
  Language: Polish (pl-PL)
  All artifacts must be written in Polish (pl-PL).
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: gstack, a TypeScript/Bun repository generating agent skills and CLIs.
  Runtime: Bun 1.3.10. Use bun commands; do not introduce npm or pnpm lockfiles.
  Generated SKILL.md files are outputs. Edit their .tmpl sources and regenerate them.
  Baseline verification commands: bun test, bun run build, bun run skill:check.
  OpenSpec is advisory project state. AGENTS.md and Adam's explicit approvals take precedence.

rules:
  proposal:
    - Opisz problem, mierzalne kryteria sukcesu, non-goals, blast radius i rollback.
    - Wskaż wpływ na kompatybilność Claude Code, Codex i OpenClaw.
  specs:
    - Opisuj obserwowalne zachowanie, błędy, kompatybilność, security i privacy.
    - Każdy requirement musi mieć konkretne scenariusze WHEN/THEN.
  design:
    - Porównaj alternatywy oraz opisz ryzyka, migrację, rollback i monitoring.
    - Wskaż źródła generowane i komendy regeneracji, gdy zmiana dotyka skilli.
  tasks:
    - Dziel pracę na pionowe slice'y z kryterium akceptacji.
    - Każdy slice musi podawać komendę i oczekiwany dowód weryfikacji.
    - Stosuj RED-GREEN-REFACTOR; nie odkładaj testów na później.

operations:
  apply:
    guidance:
      - Nie zaczynaj implementacji bez jawnej akceptacji Adama dla proposal, specs, design i tasks.
      - Zachowaj minimalny scope i wykonuj po jednym pionowym slice'ie.
      - Nie oznaczaj zadania jako ukończonego bez świeżego dowodu testowego.
  archive:
    guidance:
      - Nie archiwizuj przed targetowanymi testami, wymaganym baseline i strict validation.
      - Archiwizacja wymaga jawnej zgody Adama po przedstawieniu dowodów.
