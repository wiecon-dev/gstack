interface:
  display_name: "continuous-checkpoint-mode"
  short_description: "Auto-commit postępu w trakcie długich sesji (WIP z blokiem [gstack-context]). Adaptacja gstack Continuous Checkpoint Mode. Domyślnie OFF — explicit opt-in."
