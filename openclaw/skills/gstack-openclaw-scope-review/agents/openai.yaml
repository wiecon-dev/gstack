interface:
  display_name: "gstack-openclaw-scope-review"
  short_description: "Scope plan review z 4 trybami (EXPANSION/SELECTIVE/HOLD/REDUCTION). Adaptacja gstack /plan-ceo-review do OpenClaw. Użyj gdy Adam prosi o review planu lub decyzję o rozszerzeniu/zwężeniu scope."
  default_prompt: "Use $gstack-openclaw-scope-review when reviewing plans, challenging proposals, or making scope decisions. HARD GATE: Adam jest 100% w kontroli — nigdy cicho add/remove scope."
policy:
  allow_implicit_invocation: false
