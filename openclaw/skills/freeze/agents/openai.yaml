interface:
  skill_name: freeze
  version: 1.0.0
  description: Restrict write/edit operations to a specific directory for the session.
  inputs:
    - Directory path (set via freeze-set.sh)
    - OpenClaw write/edit tool input JSON (stdin)
  outputs:
    - JSON: {decision, reason, file_path?, boundary?}

policy:
  activation: on_user_request
  fail_mode: open
  default_state: inactive
  enforcement: soft_agent_discipline
  state_location: ~/.openclaw/state/freeze-dir.txt
  state_format: absolute_path_with_trailing_slash
  override: per_call_set_unfreeze

tools:
  - Bash
  - Read
  - message
  - write
  - edit

dependencies:
  python3: required_for_fallback_json_parsing
  bash: required